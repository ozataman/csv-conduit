name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    name: determine test scope
    runs-on: ubuntu-24.04
    outputs:
      run-tests: ${{ steps.scope.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine whether tests are required
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-scope.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Test scope classifier
        run: scripts/ci-scope-test.sh

  cabal:
    needs: scope
    if: needs.scope.outputs.run-tests == 'true'
    uses: ./.github/workflows/cabal.yml

  stack:
    needs: scope
    if: needs.scope.outputs.run-tests == 'true'
    uses: ./.github/workflows/stack.yml

  cabal-status:
    name: cabal build
    if: always()
    needs:
      - scope
      - cabal
    runs-on: ubuntu-24.04
    steps:
      - name: Report the applicable Cabal result
        run: |
          set -euo pipefail

          if [[ "${{ needs.scope.result }}" != "success" ]]; then
            echo "Unable to determine whether this change requires Cabal tests."
            exit 1
          fi

          if [[ "${{ needs.scope.outputs.run-tests }}" == "false" ]]; then
            echo "Documentation-only change: Cabal tests are not required."
            exit 0
          fi

          if [[ "${{ needs.cabal.result }}" != "success" ]]; then
            echo "Cabal matrix result: ${{ needs.cabal.result }}"
            exit 1
          fi

          echo "Cabal matrix passed."

  stack-status:
    name: stack build
    if: always()
    needs:
      - scope
      - stack
    runs-on: ubuntu-24.04
    steps:
      - name: Report the applicable Stack result
        run: |
          set -euo pipefail

          if [[ "${{ needs.scope.result }}" != "success" ]]; then
            echo "Unable to determine whether this change requires Stack tests."
            exit 1
          fi

          if [[ "${{ needs.scope.outputs.run-tests }}" == "false" ]]; then
            echo "Documentation-only change: Stack tests are not required."
            exit 0
          fi

          if [[ "${{ needs.stack.result }}" != "success" ]]; then
            echo "Stack matrix result: ${{ needs.stack.result }}"
            exit 1
          fi

          echo "Stack matrix passed."

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - cabal-status
      - stack-status
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce the applicable test results
        run: |
          set -euo pipefail

          if [[ "${{ needs.cabal-status.result }}" != "success" ]]; then
            echo "Cabal status result: ${{ needs.cabal-status.result }}"
            exit 1
          fi

          if [[ "${{ needs.stack-status.result }}" != "success" ]]; then
            echo "Stack status result: ${{ needs.stack-status.result }}"
            exit 1
          fi

          echo "The applicable Stack and Cabal checks passed."
